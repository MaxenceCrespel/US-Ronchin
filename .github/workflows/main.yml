name: Pipeline CI/CD Ronchin US App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 7 * * *"

# The nightly schedule run and a push-triggered run both end up executing
# `docker compose up -d --build` on the same VPS in Deploy-Staging — without
# serializing them, two overlapping runs race on Docker's container rename
# step and one fails with a "container name already in use" conflict.
# cancel-in-progress stays false so a legitimate deploy is never killed
# mid-flight, which would leave the VPS in a half-updated state.
concurrency:
  group: ronchin-ci-cd
  cancel-in-progress: false

permissions:
  security-events: write
  contents: read
  actions: read
  issues: write
  packages: write

jobs:
  Linter-and-Tests:
    uses: ./.github/workflows/linter-tests.yml

  Secret-Scanning:
    uses: ./.github/workflows/secret-scan.yml

  SAST-Semgrep:
    needs: Linter-and-Tests
    uses: ./.github/workflows/sast-semgrep.yml

  SCA-Dependency-Scan:
    needs: Linter-and-Tests
    uses: ./.github/workflows/sca-audit.yml

  IaC-Security-Checkov:
    uses: ./.github/workflows/iac-checkov.yml

  Docker-Build-and-Security:
    needs: Linter-and-Tests
    uses: ./.github/workflows/docker-build.yml

  DAST-OWASP-ZAP:
    needs: Docker-Build-and-Security
    uses: ./.github/workflows/dast-zap.yml

  E2E-Cypress:
    needs: Docker-Build-and-Security
    uses: ./.github/workflows/e2e-cypress.yml

  Deploy-Staging:
    needs: [DAST-OWASP-ZAP, E2E-Cypress]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    uses: ./.github/workflows/deploy-staging.yml
    # Explicit list rather than `secrets: inherit` — the deploy job only
    # ever touches these, no reason to hand it every repo secret.
    secrets:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
