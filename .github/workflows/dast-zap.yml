name: DAST ZAP

on:
  workflow_call:

jobs:
  DAST-OWASP-ZAP:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Démarrage de l'infrastructure
        run: |
          docker compose up -d --build
          sleep 15
      - name: Attaque dynamique (OWASP ZAP) via Docker
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm --network host \
            -v $(pwd)/zap-reports:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:80 -r zap-report.html -I
      - name: Sauvegarde du rapport ZAP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-scan-report
          path: zap-reports/zap-report.html
      - name: Arrêt des services
        if: always()
        run: docker compose down -v
