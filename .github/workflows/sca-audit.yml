name: SCA Dependency Scan

on:
  workflow_call:

jobs:
  SCA-Dependency-Scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configuration de Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Installation des dépendances (monorepo npm workspaces)
        run: npm ci
      - name: Audit des dépendances API (Backend)
        # --omit=dev: le build de prod (apps/api/Dockerfile) fait `npm prune
        # --omit=dev` avant de livrer l'image — les devDependencies (Jest,
        # ts-jest, ts-node...) ne sont jamais expédiées, donc les auditer
        # ferait échouer la CI sur des CVE inatteignables en prod.
        #
        # check-audit.py filtre l'advisory brace-expansion déjà documentée
        # (voir .trivyignore) — toute AUTRE vulnérabilité high/critical fait
        # toujours échouer ce job normalement.
        run: |
          npm audit --omit=dev --audit-level=high --workspace=api --json > audit-api.json || true
          python3 .github/scripts/check-audit.py audit-api.json
      - name: Audit des dépendances Frontend
        run: npm audit --audit-level=high --workspace=web || true
