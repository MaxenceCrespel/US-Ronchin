name: E2E Cypress Tests

on:
  workflow_call:

env:
  COACH_EMAIL: e2e-coach@ronchin-us.fr
  COACH_PASSWORD: E2eCoachPassword123!

jobs:
  Cypress-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configuration de Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Installation des dépendances (monorepo npm workspaces)
        run: npm ci

      # docker-compose.yml embarque des placeholders JWT/DB fonctionnels par
      # défaut et expose Postgres sur le port 5434 de l'hôte — synchronize:true
      # côté TypeORM crée le schéma tout seul, pas de migration à lancer.
      - name: Démarrage de l'infrastructure Docker (DB + API + Front)
        run: docker compose up -d --build

      # Un `sleep` fixe ne suffit pas : le compte de test ci-dessous ouvre sa
      # propre connexion TypeORM (synchronize:true) en parallèle de celle de
      # l'API — sans attendre que l'API ait fini SA synchronisation de schéma
      # au tout premier démarrage, les deux peuvent se marcher dessus.
      - name: Attente de la disponibilité de l'API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:80/api > /dev/null; then
              echo "API prête."
              exit 0
            fi
            sleep 2
          done
          echo "L'API n'a jamais répondu à temps."
          docker compose logs api
          exit 1

      # Compte de test créé via le script existant apps/api/src/seed-coach.ts
      # (exécuté ici sur l'hôte plutôt que dans le conteneur API, puisque ce
      # dernier est une image de prod allégée de ses devDependencies comme
      # ts-node — voir apps/api/Dockerfile).
      - name: Création du compte coach de test
        working-directory: apps/api
        env:
          DB_HOST: localhost
          DB_PORT: 5434
          DB_USER: ronchin
          DB_PASSWORD: ronchin
          DB_NAME: ronchin_us_app
          SEED_COACH_EMAIL: ${{ env.COACH_EMAIL }}
          SEED_COACH_PASSWORD: ${{ env.COACH_PASSWORD }}
        run: npm run seed:coach

      - name: Exécution des tests Cypress
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6
        with:
          working-directory: apps/web
          wait-on: "http://localhost:80"
          wait-on-timeout: 60
        env:
          CYPRESS_COACH_EMAIL: ${{ env.COACH_EMAIL }}
          CYPRESS_COACH_PASSWORD: ${{ env.COACH_PASSWORD }}

      - name: Sauvegarde de la vidéo en cas d'échec
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: cypress-video
          path: apps/web/cypress/videos

      - name: Extinction de l'infrastructure
        if: always()
        run: docker compose down -v
