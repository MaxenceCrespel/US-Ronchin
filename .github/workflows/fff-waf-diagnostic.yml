name: FFF-WAF-Diagnostic

# One-off diagnostic, not part of the regular pipeline: checks whether GitHub's own hosted
# runner IP gets the same anti-bot 403 from epreuves.fff.fr that the production VPS gets — see
# the conversation that added this. Manually triggered only; safe to delete once answered.
on:
  workflow_dispatch:

jobs:
  check:
    name: Check-FFF-Access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Playwright + stealth
        run: |
          mkdir -p /tmp/fff-check && cd /tmp/fff-check
          npm init -y >/dev/null
          npm install playwright-extra puppeteer-extra-plugin-stealth playwright >/dev/null
          npx playwright install --with-deps chrome
      - name: Hit the FFF calendar page
        run: |
          cd /tmp/fff-check
          node -e "
          const { chromium } = require('playwright-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          chromium.use(StealthPlugin());
          (async () => {
            const browser = await chromium.launch({ channel: 'chrome', args: ['--disable-blink-features=AutomationControlled'] });
            const page = await browser.newPage();
            const res = await page.goto('https://epreuves.fff.fr/competition/club/500112-ronchin-us-3/equipe/2026_248_SEM_12/resultat-calendrier', { waitUntil: 'networkidle', timeout: 30000 });
            console.log('STATUS:', res.status());
            await browser.close();
          })();
          "
