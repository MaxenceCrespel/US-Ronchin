name: Docker Build & Scan

on:
  workflow_call:

jobs:
  Docker-Build-and-Security:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: write
    strategy:
      matrix:
        # Two images (api + web), unlike a monolith setup — see
        # apps/api/Dockerfile and apps/web/Dockerfile.
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Connexion à GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Configuration du nom de l'image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_TAG=ghcr.io/$REPO_LOWER-${{ matrix.name }}:latest" >> $GITHUB_ENV

      - name: Build de l'image Docker (${{ matrix.name }})
        run: |
          docker build -f ${{ matrix.dockerfile }} -t ${{ env.IMAGE_TAG }} .

      - name: Scan Trivy (SARIF pour GitHub Security)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: "sarif"
          output: "trivy-results-${{ matrix.name }}.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      - name: Scan Trivy (Bloquant avec gestion des exceptions)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          trivyignores: .trivyignore

      - name: Génération du SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE_TAG }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json

      - name: Sauvegarde du fichier SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-ronchin-us-app-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json

      - name: Publication de l'image sur GHCR (Continuous Delivery)
        run: |
          docker push ${{ env.IMAGE_TAG }}
