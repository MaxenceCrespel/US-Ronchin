server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx serves everything uncompressed unless told otherwise: the ~625 KB entry bundle
    # went over the wire at full size (≈190 KB gzipped), which is what dominates first paint
    # on a mobile connection. text/html is always compressed once gzip is on, so it isn't
    # listed. Already-compressed formats (woff2, png, glb) are deliberately left out.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/manifest+json
        image/svg+xml;

    location /api/ {
        # Static assets only. The API doesn't compress its own responses, and these carry
        # auth tokens — compressing secrets together with request-influenced content over
        # TLS is the BREACH pattern, so that's a deliberate decision, not a side effect of
        # turning gzip on for the bundle.
        gzip off;
        proxy_pass http://api:3001/api/;
        # Fixed value rather than the client-supplied request Host — this
        # proxy only ever targets the internal api service, no reason to
        # forward an attacker-controlled header to it.
        proxy_set_header Host api;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router client-side routing — any non-file, non-/api request
    # falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html and the service worker must always be revalidated — they're what
    # point the browser at the current hashed JS/CSS bundle. Without this, browsers
    # (especially iOS PWAs) can keep serving a stale index.html pointing at bundles
    # that no longer exist on the server, silently freezing the app on an old build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Vite fingerprints these filenames with a content hash, so a new deploy always
    # ships new filenames — safe to cache aggressively and forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
